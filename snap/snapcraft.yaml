name: hyperframes
base: core26
version: '0.8.200'
title: HyperFrames
icon: snap/gui/hyperframes.png
summary: Create, preview and render HTML video compositions
description: |
  HyperFrames creates HTML video compositions and renders videos locally with
  Chromium and FFmpeg. On amd64, launch HyperFrames from the application menu
  to use the desktop Studio. The command-line application and browser-based
  Studio are available on both amd64 and arm64.

  Create a project with hyperframes init my-video, preview it with
  hyperframes preview my-video, and render it with hyperframes render my-video.
license: Apache-2.0
grade: stable
confinement: strict
website: https://hyperframes.heygen.com
source-code:
  - https://github.com/heygen-com/hyperframes
  - https://github.com/sidalit/hyperframes-snap
issues:
  - https://github.com/heygen-com/hyperframes/issues
  - https://github.com/sidalit/hyperframes-snap/issues
contact: https://github.com/sidalit/hyperframes-snap/issues

platforms:
  amd64:
  arm64:

apps:
  hyperframes:
    command: bin/hyperframes
    extensions: [gnome]
    plugs:
      - home
      - network
      - network-bind
      - browser-support
      - audio-playback
      - audio-record
      - password-manager-service
      - removable-media
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      LD_LIBRARY_PATH: $SNAP_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
      GIT_TEMPLATE_DIR: $SNAP/usr/share/git-core/templates
      HYPERFRAMES_BROWSER_PATH: $SNAP/bin/chrome-headless-shell
      PRODUCER_HEADLESS_SHELL_PATH: $SNAP/bin/chrome-headless-shell
      HYPERFRAMES_FFMPEG_PATH: $SNAP/usr/bin/ffmpeg
      HYPERFRAMES_FFPROBE_PATH: $SNAP/usr/bin/ffprobe
      HYPERFRAMES_SKIP_SKILLS: '1'
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
      HYPERFRAMES_NO_AUTO_INSTALL: '1'

layout:
  /etc/fonts:
    bind: $SNAP/etc/fonts
  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts
  /usr/share/fontconfig:
    bind: $SNAP/usr/share/fontconfig

parts:
  hyperframes:
    plugin: npm
    npm-include-node: true
    npm-node-version: '24'
    source: https://github.com/heygen-com/hyperframes.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-subdir: packages/cli
    build-snaps:
      - node/24/stable
    build-packages:
      - ca-certificates
      - curl
      - git
      - build-essential
      - python3
    stage-packages:
      - libstdc++6
    build-environment:
      - PUPPETEER_SKIP_DOWNLOAD: 'true'
    override-build: |
      npm install --global --prefix "$CRAFT_PART_BUILD/.bun" bun@1.4.3
      export PATH="$CRAFT_PART_BUILD/.bun/bin:$PATH"
      NODE_ENV=development bun install --frozen-lockfile
      bun run build

      # The npm plugin packages the built CLI and includes Node/npm for runtime use.
      craftctl default
      # The launcher part supplies the command with writable snap-owned paths.
      rm "$CRAFT_PART_INSTALL/bin/hyperframes"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/hyperframes/LICENSE"

  chromium:
    plugin: dump
    source:
      - to amd64: https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.84/linux64/chrome-headless-shell-linux64.zip
      - to arm64: https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.84/linux-arm64/chrome-headless-shell-linux-arm64.zip
    source-type: zip
    source-checksum:
      - to amd64: sha256/a5d71b91aa996fef00517cd212b2dfb816b43055edefbe727e6fd562d4ae1f9c
      - to arm64: sha256/0c83c2520b513835c712590781adbdbcab4c14ca04d4809be5055ff2c8937a51
    organize:
      - to amd64:
          chrome-headless-shell-linux64: lib/chromium
      - to arm64:
          chrome-headless-shell-linux-arm64: lib/chromium
    stage-packages:
      - ffmpeg
      - fontconfig
      - fonts-dejavu-core
      - fonts-liberation
      - fonts-noto-core
      - fonts-noto-cjk
      - fonts-noto-color-emoji
      - libasound2t64
      - libgbm1
      - libgtk-3-0t64
      - libnss3
      - libcurl4t64
      - libudev1
      - libxcb1

  desktop:
    plugin: nil
    # The desktop has its own release stream, separate from the CLI version.
    source:
      - to amd64: https://static.heygen.ai/hyperframes-oss/desktop/HyperFrames-amd64.deb
    source-type: deb
    # add source-checksum once deb are stable
    build-packages:
      - to amd64:
          - jq
          - patchelf
    stage-packages:
      - to amd64:
          - ca-certificates
          - curl
          - git
          - libsecret-1-0
    override-build:
      - to amd64: |
          cp -a "$CRAFT_PART_SRC/opt" "$CRAFT_PART_INSTALL/"
          install -Dm644 "$CRAFT_PROJECT_DIR/snap/gui/hyperframes.desktop.in" \
            "$CRAFT_PART_INSTALL/meta/gui/hyperframes.desktop"
          desktop="$CRAFT_PART_INSTALL/opt/hyperframes"
          rm "$desktop/chrome-sandbox"

          # No build SHA disables the desktop's updater; snap refresh owns updates.
          jq 'del(.HFBuildSha)' "$desktop/resources/build.json" > build.json
          install -m644 build.json "$desktop/resources/build.json"

          # Match snapd's desktop entry for window icons and grouping.
          jq '.desktopName = "hyperframes_hyperframes.desktop"' \
            "$desktop/resources/app.asar.unpacked/package.json" > package.json
          install -m644 package.json "$desktop/resources/app.asar.unpacked/package.json"

          # Agent installers strip LD_LIBRARY_PATH; GNOME supplies some shared libraries.
          triplet="$CRAFT_ARCH_TRIPLET_BUILD_FOR"
          gnome_runtime='$ORIGIN/../../gnome-platform'
          patchelf --force-rpath --set-rpath \
            "\$ORIGIN/../lib/$triplet:$gnome_runtime/usr/lib/$triplet:$gnome_runtime/usr/lib:$gnome_runtime/lib/$triplet" \
            "$CRAFT_PART_INSTALL/usr/bin/curl"

  launcher:
    plugin: dump
    source: snap/local
